[package]
name = "aerial_core"
version = "0.1.1"
edition = "2021"
license = "GPL-2.0-or-later"
description = "cxx-qt bridge exposing Apple Aerial manifest fetching and video caching to QML"

[lib]
crate-type = ["cdylib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "4", default-features = false, features = ["tokio"] }
dirs = "5"
futures-util = "0.3"
thiserror = "1"
once_cell = "1"
tracing = "0.1"
libc = "0.2"

[build-dependencies]
cxx-qt-build = "0.10"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
