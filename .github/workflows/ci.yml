name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    # aerial_core's build.rs (via cxx-qt-build) needs to find a real Qt
    # installation to run at all -- even just for `cargo clippy`/`cargo
    # test` -- so this can't run on a bare ubuntu-latest runner. Same pinned
    # Arch container as cmake-build below, whose `rust` package already
    # bundles rustfmt/clippy (unlike upstream rustup, which needs a separate
    # component install).
    container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
    steps:
      - name: Pin Arch package repositories to a dated snapshot
        # The container digest above only fixes the starting filesystem;
        # pacman -Syu still resolves packages from whatever's live on the
        # mirrors at run time, so the actual toolchain used here could still
        # drift (or a mirror mid-transition could break the install)
        # between runs. Point at a fixed Arch Linux Archive date instead.
        # Bump deliberately: https://archive.archlinux.org/repos/
        run: echo 'Server = https://archive.archlinux.org/repos/2026/09/01/$repo/os/$arch' > /etc/pacman.d/mirrorlist

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git rust qt6-base qt6-declarative qt6-multimedia

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --all-features

  cmake-build:
    name: CMake build (Arch)
    runs-on: ubuntu-latest
    # archlinux:latest, pinned to a reviewed digest so the toolchain used here
    # doesn't shift underneath the workflow without a deliberate bump.
    container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
    steps:
      - name: Pin Arch package repositories to a dated snapshot
        run: echo 'Server = https://archive.archlinux.org/repos/2026/09/01/$repo/os/$arch' > /etc/pacman.d/mirrorlist

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git cmake extra-cmake-modules corrosion \
            rust qt6-base qt6-declarative qt6-multimedia \
            kpackage libplasma

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -Wno-dev

      - name: Build
        run: cmake --build build

      - name: Run standalone QML bridge test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          QML2_IMPORT_PATH: ${{ github.workspace }}/build/qml_modules
        run: ./build/tests/qml_bridge_test/aerial_qml_bridge_test
