name: Release build

# release-please.yml dispatches this directly (via workflow_dispatch) once
# it cuts a release, since a release authored by GITHUB_TOKEN can't trigger
# the `release: published` event below (GitHub's anti-recursion rule). That
# trigger is kept as a fallback for a release published by hand, and
# workflow_dispatch also serves as a manual re-run for a failed build.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing GitHub Release tag to build and publish (e.g. plasma6-wallpapers-aerial-v0.1.0)
        required: true

permissions:
  contents: write

# Only x86_64 is built and published here even though PKGBUILD/pacman-repo
# consumers may see aarch64 referenced elsewhere in docs -- cross-building
# the Qt6/cxx-qt/corrosion toolchain for aarch64 needs either a native ARM
# runner or QEMU emulation, neither of which is set up yet. Revisit if/when
# aarch64 support is actually needed.
jobs:
  build-and-publish:
    name: Build Arch package and publish
    runs-on: ubuntu-latest
    # archlinux:latest, pinned to a reviewed digest (see ci.yml for the same
    # pin) so the toolchain used for release artifacts doesn't shift without
    # a deliberate bump.
    container: archlinux@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
    env:
      TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
    steps:
      # The container digest above only fixes the starting filesystem;
      # pacman -Syu still resolves packages from whatever's live on the
      # mirrors at run time, so a rebuild of the same release tag could get a
      # different toolchain, or hit a mirror mid-transition. Pin to a fixed
      # Arch Linux Archive date. Bump deliberately:
      # https://archive.archlinux.org/repos/
      - name: Pin Arch package repositories to a dated snapshot
        run: echo 'Server = https://archive.archlinux.org/repos/2026/09/01/$repo/os/$arch' > /etc/pacman.d/mirrorlist

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git github-cli \
            extra-cmake-modules cmake corrosion rust \
            qt6-base qt6-declarative qt6-multimedia \
            kpackage libplasma

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          persist-credentials: false

      - name: Create unprivileged build user
        run: |
          useradd -m builduser
          chown -R builduser:builduser "$GITHUB_WORKSPACE"

      - name: makepkg
        run: su builduser -c 'makepkg --noconfirm --nodeps'

      - name: Locate built package
        id: pkg
        run: |
          pkgfile=$(ls -1 ./*.pkg.tar.zst | head -n1)
          echo "path=$pkgfile" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$pkgfile")" >> "$GITHUB_OUTPUT"

      - name: Upload package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # --repo avoids gh's default repo auto-detection, which shells out to
        # git and fails here: makepkg's build user step above chowned the
        # workspace to builduser, but this step runs back as the container's
        # default user, so git refuses the mismatched ownership.
        run: gh release upload "${{ env.TAG_NAME }}" "${{ steps.pkg.outputs.path }}" --clobber --repo "${{ github.repository }}"

      - name: Publish to Silo
        # Pinned to a specific, reviewed commit rather than a branch/tag
        # that could move, and to an explicit CLI `version` rather than
        # this action's own "latest" default, so a compromised/replaced
        # Silo release can't silently run code with access to SILO_TOKEN.
        # Bump both together when intentionally upgrading the CLI:
        # https://github.com/BirknerAlex/silo/releases
        uses: BirknerAlex/silo/.github/actions/publish@580ab405118d91a6deaa562c8c955ef38bec4583
        with:
          server: ${{ secrets.SILO_SERVER }}
          token: ${{ secrets.SILO_TOKEN }}
          repo: birkneralex
          channel: stable
          files: ${{ steps.pkg.outputs.path }}
          version: v0.11.0
