name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # To dispatch release-build.yml once a release exists; see the last step.
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release authored by GITHUB_TOKEN doesn't fire other workflows'
      # `release: published` trigger (GitHub's anti-recursion rule), so
      # release-build.yml's `on: release: published` would never see this.
      # workflow_dispatch is the documented exception to that rule, and
      # release-build.yml already takes the tag as an input -- it was there
      # as a manual fallback, and serves double duty here.
      - name: build and publish the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "dispatching release-build.yml for $TAG"
          gh workflow run release-build.yml -f tag_name="$TAG" --repo "${{ github.repository }}"
