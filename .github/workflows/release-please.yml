name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Releases authored by the default GITHUB_TOKEN don't fire other
          # workflows' `release: published` trigger (GitHub's anti-recursion
          # rule), which would silently stop release-build.yml from running.
          # Set a repo secret RELEASE_PLEASE_TOKEN (a PAT/App token with
          # `contents: write` + `pull-requests: write`) to fix that; falls
          # back to GITHUB_TOKEN (release-please still works, just won't
          # trigger the build) if it isn't configured.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
